syntax = "proto3";

package nazobu.v1;

option go_package = "github.com/aruma256/nazobu/backend/internal/gen/nazobu/v1;nazobuv1";

// UserService は現在ログイン中の user に関する RPC、user 一覧の参照 RPC、および user の事前登録 RPC を提供する。
service UserService {
  // GetMe は cookie session から現在の user を返す。未ログインなら unauthenticated。
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // RegisterUser は Discord ユーザーを事前登録する（ログインの許可と、ログイン前のメンションを可能にするため）。admin のみ。
  // 登録済みなら already_exists を返し、既存ユーザーは更新しない。
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
}

message GetMeRequest {}

message GetMeResponse {
  // 旧 username field（id=2）を削除済み。再利用しないため reserved。
  reserved 2;
  reserved "username";
  string id = 1;
  // 表示名（NOT NULL）。IdP 側で空のときはハンドル名等にフォールバックして埋める。
  string display_name = 3;
  // avatar URL は未設定なら空文字列。
  string avatar_url = 4;
  // 'admin' / 'member'。schema.sql の users.role と同じ値。
  string role = 5;
}

message ListUsersRequest {}

message ListUsersResponse {
  // users は display_name 昇順。
  repeated User users = 1;
}

message RegisterUserRequest {
  // Discord ユーザー ID（Snowflake）。
  string discord_user_id = 1;
  // ログインするまでの表示名。ログイン時に Discord の値で上書きされる。
  string display_name = 2;
}

message RegisterUserResponse {
  User user = 1;
}

message User {
  // 旧 username field（id=2）を削除済み。再利用しないため reserved。
  reserved 2;
  reserved "username";
  string id = 1;
  // 表示名（NOT NULL）。
  string display_name = 3;
}
